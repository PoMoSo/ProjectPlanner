  var met=0,missed=0,od=0,soon=0,later=0;
  ts.forEach(function(t){if(!t.deadline)return;if(t.done){if(finishDay(t)<=t.deadline)met++;else missed++}else if(t.deadline<td)od++;else if(t.deadline<=addDays(td,6))soon++;else later++});
  var dl=[{name:'Met',v:met,color:STATUS_COL.good},{name:'Missed (finished late)',v:missed,color:STATUS_COL.serious},{name:'Overdue',v:od,color:STATUS_COL.crit},{name:'Due within 7 days',v:soon,color:STATUS_COL.warn},{name:'Due later',v:later,color:STATUS_COL.muted}];
  var s5=styleSeg('deadlines',['bar','donut','table'],'bar');
  h+=card('Deadlines','Tasks with a deadline, by outcome',s5.html,compChart(s5.cur,dl,'No tasks have a deadline yet.'));

  // Milestones
  var mh=0,mm=0,mo=0,mu=0;
  ms.forEach(function(m){var st=msState(m);if(st==='hit')mh++;else if(st==='late')mm++;else if(st==='overdue')mo++;else mu++});
  var s6=styleSeg('milestones',['bar','donut','table'],'bar');
  h+=card('Milestones','Reached on time, late, overdue or still ahead',s6.html,compChart(s6.cur,[{name:'Reached on time',v:mh,color:STATUS_COL.good},{name:'Reached late',v:mm,color:STATUS_COL.serious},{name:'Overdue',v:mo,color:STATUS_COL.crit},{name:'Upcoming',v:mu,color:STATUS_COL.muted}],'No milestones yet. Add them in a task’s details under Milestones.'));

  // Planned vs actual
  var early=0,ontime=0,l1=0,l2=0,l3=0,lateSum=0,lateN=0;
  ts.forEach(function(t){if(!t.done||!t.endDate||!t.doneAt)return;var diff=daysBetween(t.endDate,finishDay(t));if(diff<0)early++;else if(diff===0)ontime++;else{lateSum+=diff;lateN++;if(diff<=3)l1++;else if(diff<=7)l2++;else l3++}});
  var s7=styleSeg('finish',['bar','donut','table'],'bar');
  h+=card('Planned vs. actual finish',lateN?'Late tasks finished '+(Math.round(lateSum/lateN*10)/10)+' days after their planned end on average':'Finished tasks compared with their planned end date',s7.html,
    compChart(s7.cur,[{name:'Early',v:early,color:STATUS_COL.good},{name:'On the day',v:ontime,color:'var(--s1)'},{name:'1–3 days late',v:l1,color:STATUS_COL.warn},{name:'4–7 days late',v:l2,color:STATUS_COL.serious},{name:'8+ days late',v:l3,color:STATUS_COL.crit}],'No finished tasks with a planned end date yet.'));
  h+='</div>';
  return h;
}
document.addEventListener('mouseover',function(e){if(drag)return;var el=e.target.closest&&e.target.closest('[data-tip]');if(el&&!COARSE){el._tip=1;showTip(el.getAttribute('data-tip'),e.clientX,e.clientY)}});
document.addEventListener('mousemove',function(e){if(drag||COARSE)return;var el=e.target.closest&&e.target.closest('[data-tip]');if(el)showTip(el.getAttribute('data-tip'),e.clientX,e.clientY);else if(tipEl&&!drag)hideTip()});
document.addEventListener('scroll',function(){if(!drag)hideTip()},true);

/* ---------- Goals ---------- */
function goalById(id){return state.goals.find(function(g){return g.id===id})}
function goalSecs(pid){return pid?P(pid).goalSections:state.goalSections}
function goalSecId(g){var secs=goalSecs(g.projectId);for(var i=0;i<secs.length;i++)if(secs[i].id===g.sectionId)return g.sectionId;return secs[0].id}
function goalsIn(pid,sid){return state.goals.filter(function(g){return (g.projectId||null)===(pid||null)&&goalSecId(g)===sid}).sort(byOrder)}
function goalsInScope(){return ui.projectId?state.goals.filter(function(g){return g.projectId===ui.projectId}):state.goals}
function goalChips(g){
  var c='';
  if(g.targetDate){var dl=daysFromToday(g.targetDate),st=g.done?'':dl<0?'overdue':dl<=7?'soon':'';
    c+='<span class="chip '+st+'">'+ICON.target+esc((st==='overdue'?'Target passed \u00b7 ':'Target ')+fmtDate(g.targetDate))+'</span>'}
  if(g.notes&&g.notes.trim())c+='<span class="chip" title="Has notes">'+ICON.note+'</span>';
  return c;
}
function goalSectionHtml(pid,sc){
  var showDone=ui.showCompleted!==false,all=goalsIn(pid,sc.id),open=all.filter(function(g){return !g.done}).length,hidden=all.length-open,pa=pid||'';
  var rows=all.filter(function(g){return showDone||!g.done}).map(function(g){
    return '<li class="task goal'+(g.done?' done':'')+'"><button class="check" data-act="goal-toggle" data-id="'+g.id+'" aria-label="'+(g.done?'Mark as not reached':'Mark as reached')+'">'+ICON.check+'</button>'+
      '<div class="task-main" data-act="goal-open" data-id="'+g.id+'"><div class="task-title">'+esc(g.title)+'</div><div class="chips">'+goalChips(g)+'</div></div></li>'}).join('');
  return '<section class="sec"><div class="sec-head"><h3 data-act="gsec-rename" data-p="'+pa+'" data-s="'+sc.id+'" title="Rename section">'+esc(sc.name)+'</h3>'+
    '<span class="count">'+(all.length?(all.length-open)+' of '+all.length+' reached':'')+'</span>'+
    '<button class="iconbtn sm" data-act="gsec-menu" data-p="'+pa+'" data-s="'+sc.id+'" aria-label="Section options">'+ICON.more+'</button></div>'+
    (!showDone&&hidden?'<div class="hidden-note">'+plural(hidden,'reached goal')+' hidden</div>':'')+
    '<ul class="tasks">'+rows+'</ul>'+
    '<form class="quick" data-submit="goaladd" data-p="'+pa+'" data-s="'+sc.id+'"><input type="text" placeholder="Add a goal\u2026" aria-label="Add a goal to '+esc(sc.name)+'" autocomplete="off" enterkeyhint="done"><button class="btn sm" type="submit">Add</button></form></section>';
}
function goalStatsTxt(pid){var g=state.goals.filter(function(x){return (x.projectId||null)===(pid||null)});return g.length?g.filter(function(x){return x.done}).length+' of '+g.length+' reached':'no goals yet'}
function renderGoals(){
  var h='<div class="toolbar"><label class="toggle"><input type="checkbox" data-change="show-completed"'+(ui.showCompleted!==false?' checked':'')+'> Show reached goals</label></div>';
  if(ui.projectId){
    h+=P(ui.projectId).goalSections.map(function(sc){return goalSectionHtml(ui.projectId,sc)}).join('');
    return h+'<button class="add-sec" data-act="gsec-add" data-p="'+ui.projectId+'">+ Add section</button>';
  }
  h+='<div class="pgroup"><div class="pgroup-head static">'+ICON.target.replace('viewBox','width="16" height="16" viewBox')+'<button class="rename-inline" data-act="rename-overall" title="Rename">'+esc(overallGoalsTitle())+'</button> <span class="muted">'+goalStatsTxt(null)+'</span></div>'+
    state.goalSections.map(function(sc){return goalSectionHtml(null,sc)}).join('')+
    '<button class="add-sec" style="margin-bottom:8px" data-act="gsec-add" data-p="">+ Add section</button></div>';
  projectsSorted().forEach(function(p){
    h+='<div class="pgroup"><button class="pgroup-head" data-act="open-project" data-id="'+p.id+'" style="--pc:'+esc(p.color)+'"><span class="dot"></span>'+esc(p.name)+' <span class="muted">'+goalStatsTxt(p.id)+'</span>'+ICON.chev+'</button>'+
      p.goalSections.map(function(sc){return goalSectionHtml(p.id,sc)}).join('')+'</div>';
  });
  return h;
}
function openGoal(g){
  var owner='<option value="">Overall (not tied to a project)</option>'+projectsSorted().map(function(p){return '<option value="'+p.id+'"'+(g.projectId===p.id?' selected':'')+'>'+esc(p.name)+'</option>'}).join('');
  var body='<div class="fld"><label for="gl-title">Goal</label><input id="gl-title" class="inp" type="text" value="'+esc(g.title)+'" autocomplete="off"></div>'+
    '<div class="grid2"><div class="fld"><label for="gl-date">Target date (optional)</label><input id="gl-date" class="inp" type="date" value="'+esc(g.targetDate)+'"></div>'+
    '<div class="fld"><label for="gl-owner">Belongs to</label><select id="gl-owner" class="inp">'+owner+'</select></div></div>'+
    '<div class="fld" style="margin-top:12px"><label for="gl-notes">Notes</label><textarea id="gl-notes" class="inp" rows="4" placeholder="Why it matters, how you\u2019ll know it\u2019s reached\u2026">'+esc(g.notes)+'</textarea></div>'+
    '<label class="toggle" style="color:var(--text)"><input type="checkbox" id="gl-done"'+(g.done?' checked':'')+'> Reached</label>';
  openModal({title:'Goal',wide:true,focus:'#gl-title',body:body,buttons:[{label:'Delete',value:'delete',cls:'danger left'},{label:'Move up',value:'up'},{label:'Move down',value:'down'},{label:'Cancel',value:null},{label:'Save',cls:'primary',value:function(r){
    var t=r.querySelector('#gl-title').value.trim();if(!t){r.querySelector('#gl-title').focus();return undefined}
    return {title:t,targetDate:r.querySelector('#gl-date').value||'',notes:r.querySelector('#gl-notes').value,owner:r.querySelector('#gl-owner').value||null,done:r.querySelector('#gl-done').checked};
  }}]}).then(function(v){
    if(!v)return;
    if(v==='delete'){confirmDlg('Delete this goal?','\u201c'+esc(g.title)+'\u201d will be deleted.','Delete',true).then(function(ok){if(!ok)return;snapshot();commit(function(){state.goals=state.goals.filter(function(x){return x.id!==g.id})});toast('Goal deleted',{label:'Undo',fn:undo})});return}
    if(v==='up'||v==='down'){var sib=goalsIn(g.projectId,goalSecId(g));sib.forEach(function(x,i){x.order=i+1});var i=sib.indexOf(g),j=v==='up'?i-1:i+1;if(j<0||j>=sib.length){toast(v==='up'?'Already at the top':'Already at the bottom');return}commit(function(){var o=sib[i].order;sib[i].order=sib[j].order;sib[j].order=o});return}
    commit(function(){
      g.title=v.title;g.targetDate=v.targetDate;g.notes=v.notes;
      if(v.done!==g.done){g.done=v.done;g.doneAt=v.done?nowISO():null}
      if((v.owner||null)!==(g.projectId||null)){g.projectId=v.owner;g.sectionId=goalSecs(v.owner)[0].id;g.order=goalsIn(v.owner,g.sectionId).length+1}
      g.updatedAt=nowISO();
    });
    toast('Goal saved');
  });
}

/* ---------- Event wiring ---------- */
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-act]');if(!el||el.disabled)return;
  var f=A[el.getAttribute('data-act')];if(f){e.preventDefault();f(el,e)}
});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'&&!$('#modal-root').innerHTML&&ui.taskId){closePanel();return}
  if((e.key==='Enter'||e.key===' ')&&e.target.classList&&e.target.classList.contains('pcard')&&e.target===document.activeElement){e.preventDefault();openProject(e.target.getAttribute('data-id'))}
});
document.addEventListener('submit',function(e){
  var f=e.target,kind=f.getAttribute('data-submit');if(!kind)return;e.preventDefault();
  var inp=f.querySelector('input'),v=inp.value.trim();if(!v){inp.focus();return}
  if(kind==='quickadd'){
    var pid=f.getAttribute('data-project'),sid=f.getAttribute('data-section');
    commit(function(){createTask({projectId:pid,sectionId:sid,title:v})});
    ui.focusQuick='form[data-section="'+sid+'"] input';renderMain();
  }else if(kind==='caladd'){
    var cd=f.getAttribute('data-d'),sel=f.querySelector('select'),cpid=ui.projectId||(sel&&sel.value);
    if(!cpid)return;
    commit(function(){createTask({projectId:cpid,title:v,startDate:cd,endDate:cd})});
    ui.focusQuick='form[data-submit="caladd"] input';renderMain();toast('Task added on '+fmtDate(cd));
  }else if(kind==='goaladd'){
    var gp=f.getAttribute('data-p')||null,gs=f.getAttribute('data-s');
    commit(function(){var sib=goalsIn(gp,gs);state.goals.push({id:uid(),projectId:gp,sectionId:gs,title:v,notes:'',targetDate:'',done:false,doneAt:null,order:sib.reduce(function(m,x){return Math.max(m,x.order||0)},0)+1,createdAt:nowISO(),updatedAt:nowISO()})});
    ui.focusQuick='form[data-submit="goaladd"][data-s="'+gs+'"] input';renderMain();
  }else if(kind==='kadd'){
    var kp=P(f.getAttribute('data-project')),kc=f.getAttribute('data-col');
    commit(function(){var nt=createTask({projectId:kp.id,sectionId:kp.sections[0].id,title:v});setColumn(nt,kc);nt.kOrder=nextKOrder(kp.id)});
    ui.focusQuick='form[data-col="'+kc+'"] input';renderMain();
  }else if(kind==='addsub'){
    var par=T(ui.taskId);
    commit(function(){createTask({projectId:par.projectId,parentId:par.id,title:v})});
    var ni=$('#panel-root form[data-submit="addsub"] input');if(ni)ni.focus({preventScroll:true});
  }
});
document.addEventListener('input',function(e){
  var el=e.target;
  if(el.getAttribute('data-role')==='diarysearch'){ui.diaryQuery=el.value;var pos=el.selectionStart;renderMain();var ni=$('#main [data-role=diarysearch]');if(ni){ni.focus();try{ni.setSelectionRange(pos,pos)}catch(_){}}return}
  if(el.getAttribute('data-role')==='linksearch'){linkQuery=el.value;var r=$('#link-results');var t=T(ui.taskId);if(r&&t)r.innerHTML=linkResults(t);return}
  if(el.getAttribute('data-ms')==='name'&&el.closest('.panel')){var tm=T(ui.taskId),mm=tm&&msFind(tm,el.getAttribute('data-mid'));if(mm){mm.name=el.value;touch(tm);saveSoon();renderMainSoon()}return}
  var k=el.getAttribute('data-field');if(!k||!el.closest('.panel'))return;
  var t2=T(ui.taskId);if(!t2)return;
  if(k==='title'){t2.title=el.value.replace(/\n/g,' ');touch(t2);autosize(el);saveSoon();renderMain()}
  else if(k==='notes'){t2.notes=el.value;touch(t2);saveSoon();renderMainSoon()}
});
var mainTimer=null;function renderMainSoon(){clearTimeout(mainTimer);mainTimer=setTimeout(renderMain,400)}
document.addEventListener('focusout',function(e){
  var el=e.target;if(el.getAttribute&&el.getAttribute('data-field')==='title'){var t=T(ui.taskId);if(t&&!t.title.trim()){t.title='Untitled';save();renderMain();el.value='Untitled'}}
});
document.addEventListener('keydown',function(e){
  if(e.key==='Enter'&&e.target.classList&&e.target.classList.contains('title-input')){e.preventDefault();e.target.blur()}
  if((e.key==='Enter'||e.key===',')&&e.target.getAttribute&&e.target.getAttribute('data-role')==='person-add'){e.preventDefault();addPerson(e.target)}
});
document.addEventListener('change',function(e){
  var el=e.target,ch=el.getAttribute('data-change');
  if(ch==='show-completed'){ui.showCompleted=el.checked;saveUI();renderMain();return}
  if(ch==='name-umbrella'||ch==='name-overall'){var nv=el.value.trim();commit(function(){labels()[ch==='name-umbrella'?'umbrella':'overallGoals']=nv});return}
  if(ch==='cal-spans'){ui.calSpans=el.checked;saveUI();renderMain();return}
  if(ch==='stats-project'){ui.statsProject=el.value||null;saveUI();renderMain();return}
  if(ch==='kanban-subtasks'){ui.kanbanSubtasks=el.checked;saveUI();renderMain();return}
  if(ch==='import-file'){
    var file=el.files&&el.files[0];if(!file)return;
    var rd=new FileReader();rd.onload=function(){importFromText(String(rd.result));el.value=''};rd.readAsText(file);return;
  }
  if(el.getAttribute('data-role')==='linkkind'){linkKind=el.value;return}
  if(el.getAttribute('data-role')==='person-add'){addPerson(el);return}
  if(el.getAttribute('data-ms')&&el.closest('.panel')){
    var tm=T(ui.taskId),mm=tm&&msFind(tm,el.getAttribute('data-mid'));if(!mm)return;
    if(el.getAttribute('data-ms')==='name'){if(!el.value.trim()){mm.name='Milestone';el.value='Milestone'}flushSave();save();renderMain();return}
    commit(function(){mm.date=el.value||'';touch(tm)});return;
  }
  var k=el.getAttribute('data-field');if(!k||!el.closest('.panel'))return;
  var t=T(ui.taskId);if(!t)return;
  if(k==='title'||k==='notes'){flushSave();return}
  if(k==='projectId'){commit(function(){moveTaskToProject(t,el.value)});toast('Moved to '+P(el.value).name);return}
  if(k==='sectionId'){commit(function(){setSection(t,el.value)});return}
  if(k==='columnId'){commit(function(){setColumn(t,el.value)});return}
  if(k==='parentId'){var ok=true;commit(function(){ok=setParent(t,el.value||null)});if(!ok)toast('A task can\u2019t be part of itself or its own subtask');return}
  if(k==='hasMilestones'){
    if(el.checked){var nm;commit(function(){nm=addMilestone(t,t.title,t.endDate||t.startDate||t.deadline||today())});focusMs(nm.id)}
    else if((t.milestones||[]).length){
      el.checked=true;
      confirmDlg('Remove all milestones?','This task\u2019s '+plural(t.milestones.length,'milestone')+' will be removed.','Remove',true).then(function(ok){if(ok)commit(function(){t.milestones=[];touch(t)});else renderPanel()});
    }
    return;
  }
  if(k==='startDate'||k==='endDate'||k==='deadline'){commit(function(){t[k]=el.value||'';touch(t)});return}
});
window.addEventListener('storage',function(e){
  if(e.key===DATA_KEY&&e.newValue){try{state=normalize(JSON.parse(e.newValue));render()}catch(err){}}
});

render();

/* ---------- Home-screen app: offline cache & updates ---------- */
(function(){
  if(!('serviceWorker' in navigator)||!/^https?:$/.test(location.protocol))return;
  var reloading=false;
  navigator.serviceWorker.addEventListener('controllerchange',function(){if(reloading)return;reloading=true;location.reload()});
  window.addEventListener('load',function(){
    navigator.serviceWorker.register('sw.js').then(function(reg){
      function offer(w){toast('A new version of the app is ready',{label:'Update now',fn:function(){flushSave();w.postMessage('skip-waiting')}})}
      if(reg.waiting&&navigator.serviceWorker.controller)offer(reg.waiting);
      reg.addEventListener('updatefound',function(){var w=reg.installing;if(!w)return;w.addEventListener('statechange',function(){if(w.state==='installed'&&navigator.serviceWorker.controller)offer(w)})});
      document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible')reg.update().catch(function(){})});
    }).catch(function(){});
    if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(function(){});
  });
})();
})();
</script>
