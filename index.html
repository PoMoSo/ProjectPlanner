<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Planner">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f6f5f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141413" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Project Planner</title>
<style>
:root{
  --bg:#f6f5f2; --surface:#ffffff; --surface-2:#efede8; --border:#e2dfd7;
  --text:#1f1d1a; --muted:#6f6a61; --faint:#a19b90;
  --accent:#2f6f6a; --accent-weak:#e1eeec; --on-accent:#ffffff;
  --danger:#b4402f; --danger-weak:#f8e5e1; --warn:#9a6400; --warn-weak:#fbefd5;
  --shadow:0 1px 2px rgba(30,25,15,.05),0 4px 16px rgba(30,25,15,.06);
  --panel-shadow:-8px 0 32px rgba(30,25,15,.14);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141413; --surface:#1d1d1b; --surface-2:#272725; --border:#34332f;
    --text:#ecebe6; --muted:#a09a8f; --faint:#6e695f;
    --accent:#6cbab2; --accent-weak:#1f3533; --on-accent:#0f1f1d;
    --danger:#e47d6b; --danger-weak:#3b2420; --warn:#e3ab4c; --warn-weak:#3a2e16;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);
    --panel-shadow:-8px 0 32px rgba(0,0,0,.5);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#141413; --surface:#1d1d1b; --surface-2:#272725; --border:#34332f;
  --text:#ecebe6; --muted:#a09a8f; --faint:#6e695f;
  --accent:#6cbab2; --accent-weak:#1f3533; --on-accent:#0f1f1d;
  --danger:#e47d6b; --danger-weak:#3b2420; --warn:#e3ab4c; --warn-weak:#3a2e16;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);
  --panel-shadow:-8px 0 32px rgba(0,0,0,.5);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,h4{margin:0;font-weight:650;letter-spacing:-.01em}
svg{display:block}
.muted{color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* Header */
.top{position:sticky;top:0;z-index:20;background:var(--bg);background:color-mix(in srgb,var(--bg) 90%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding-top:env(safe-area-inset-top)}
.top-inner{max-width:1000px;margin:0 auto;display:flex;align-items:center;gap:6px;padding:10px 12px 6px}
.title{flex:1;min-width:0;display:flex;align-items:center;gap:9px;font-size:19px;font-weight:700;letter-spacing:-.015em}
.title span.t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.title button.t{border:0;background:none;padding:2px 4px;margin-left:-4px;border-radius:6px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.title button.t:hover{background:var(--surface-2)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--pc,var(--accent));flex:none}
.iconbtn{width:38px;height:38px;border-radius:10px;border:0;background:transparent;display:grid;place-items:center;position:relative;flex:none;color:var(--muted)}
.iconbtn:hover{background:var(--surface-2);color:var(--text)}
.iconbtn:disabled{opacity:.3;cursor:default;background:transparent}
.iconbtn.sm{width:30px;height:30px;border-radius:8px}
.iconbtn .badge{position:absolute;top:7px;right:7px;width:8px;height:8px;border-radius:50%;background:var(--warn);border:2px solid var(--bg)}
.back{display:flex;align-items:center;gap:2px;border:0;background:none;color:var(--accent);font-weight:600;padding:6px 8px 6px 2px;border-radius:8px;flex:none}
.back:hover{background:var(--surface-2)}
.tabs{max-width:1000px;margin:0 auto;display:flex;gap:2px;overflow-x:auto;padding:0 8px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:none;padding:9px 12px 10px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap;font-size:14.5px}
.tab:hover{color:var(--text)}
.tab.on{color:var(--text);border-bottom-color:var(--accent)}
.wide .top-inner,.wide .tabs,.wide .wrap{max-width:1400px}
.wrap{max-width:1000px;margin:0 auto;padding:16px 16px calc(80px + env(safe-area-inset-bottom))}
.banner{max-width:1000px;margin:12px auto 0;padding:10px 14px;border-radius:12px;background:var(--danger-weak);color:var(--danger);font-size:14px}

/* Buttons & inputs */
.btn{border:1px solid var(--border);background:var(--surface);padding:8px 14px;border-radius:10px;font-weight:600;font-size:14.5px;display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn:hover{border-color:var(--faint)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.danger{color:var(--danger)}
.btn.danger.solid{background:var(--danger);border-color:var(--danger);color:#fff}
.btn.ghost{border-color:transparent;background:transparent;color:var(--accent)}
.btn.ghost:hover{background:var(--surface-2)}
.btn.sm{padding:5px 10px;font-size:13.5px;border-radius:8px}
.btn:disabled{opacity:.45;cursor:default}
.inp{width:100%;border:1px solid var(--border);background:var(--bg);border-radius:10px;padding:8px 10px;min-height:40px;font-size:16px}
.inp:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-weak)}
textarea.inp{resize:vertical;min-height:90px;line-height:1.45}
select.inp{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 16px) 50%,calc(100% - 11px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:28px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.toggle{display:inline-flex;align-items:center;gap:8px;font-size:14px;color:var(--muted);cursor:pointer;user-select:none}
.toggle input{accent-color:var(--accent);width:16px;height:16px}
.fld label.switch,.switch{position:relative;display:inline-flex;margin-bottom:0;font-size:14.5px;color:var(--text);font-weight:500;align-items:center;gap:10px;cursor:pointer;user-select:none}
.switch input{position:absolute;opacity:0;width:1px;height:1px}
.switch .knob{width:40px;height:24px;border-radius:99px;background:var(--surface-2);border:1px solid var(--border);position:relative;transition:background .15s}
.switch .knob::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .15s}
.switch input:checked + .knob{background:var(--accent);border-color:var(--accent)}
.switch input:checked + .knob::after{transform:translateX(16px)}
.switch input:focus-visible + .knob{box-shadow:0 0 0 3px var(--accent-weak)}

/* Empty state */
.empty{text-align:center;padding:56px 20px;color:var(--muted)}
.empty h2{color:var(--text);font-size:20px;margin-bottom:6px}
.empty p{max-width:440px;margin:0 auto 18px}
.empty .row{justify-content:center}
.coming{max-width:520px;margin:40px auto;text-align:center;color:var(--muted)}
.coming .pill{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--accent);background:var(--accent-weak);padding:3px 10px;border-radius:99px;margin-bottom:12px}
.coming h2{color:var(--text);font-size:21px;margin-bottom:8px}

/* Projects overview */
.summary{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:10px 14px;min-width:110px}
.stat b{display:block;font-size:22px;font-weight:700;letter-spacing:-.02em}
.stat span{font-size:12.5px;color:var(--muted)}
.stat.alert b{color:var(--danger)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.pcard{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px 14px 14px 18px;cursor:pointer;position:relative;overflow:hidden;box-shadow:var(--shadow);text-align:left;min-height:140px;display:flex;flex-direction:column;gap:8px}
.pcard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--pc,var(--accent))}
.pcard:hover{border-color:var(--faint)}
.pc-top{display:flex;align-items:center;gap:8px;margin-right:-6px}
.pc-top h3{flex:1;font-size:16.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pc-desc{font-size:13.5px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.bar{height:6px;background:var(--surface-2);border-radius:99px;overflow:hidden;margin-top:auto}
.bar>i{display:block;height:100%;background:var(--pc,var(--accent));border-radius:inherit}
.pc-meta{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.pcard.add{border-style:dashed;box-shadow:none;background:transparent;align-items:center;justify-content:center;color:var(--accent);font-weight:600;font-size:15px}
.pcard.add::before{display:none}

/* To Do */
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.pgroup{margin-bottom:22px}
.pgroup-head{display:flex;align-items:center;gap:9px;border:0;background:none;padding:4px 6px;margin:0 0 8px -6px;border-radius:8px;font-weight:700;font-size:16.5px}
.pgroup-head:hover{background:var(--surface-2)}
.pgroup-head .muted{font-weight:500;font-size:13.5px}
.sec{background:var(--surface);border:1px solid var(--border);border-radius:14px;margin-bottom:12px;box-shadow:var(--shadow)}
.sec-head{display:flex;align-items:center;gap:8px;padding:8px 8px 8px 16px;border-bottom:1px solid var(--border)}
.sec-head h3{font-size:14px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);cursor:pointer;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sec-head .count{font-size:12.5px;color:var(--faint);font-weight:600}
.tasks{list-style:none;margin:0;padding:0}
.task{display:flex;align-items:flex-start;gap:10px;padding:10px 12px 10px calc(14px + var(--depth,0)*26px);border-bottom:1px solid var(--border);position:relative}
.task[style*="--depth:1"],.task[style*="--depth:2"],.task[style*="--depth:3"],.task[style*="--depth:4"]{background:color-mix(in srgb,var(--surface-2) 35%,transparent)}
.task:hover{background:var(--surface-2)}
.check{flex:none;width:22px;height:22px;border-radius:50%;border:1.6px solid var(--faint);background:transparent;margin-top:0;display:grid;place-items:center;padding:0;color:transparent}
.check:hover{border-color:var(--accent);color:var(--accent)}
.done .check,.check.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.task-main{flex:1;min-width:0;cursor:pointer}
.task-title{word-break:break-word}
.task.done .task-title{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--faint)}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px}
.chips:empty{display:none}
.chip{font-size:12px;line-height:1;padding:4px 8px;border-radius:99px;background:var(--surface-2);color:var(--muted);display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.chip svg{width:12px;height:12px}
.chip.overdue{background:var(--danger-weak);color:var(--danger);font-weight:600}
.chip.soon{background:var(--warn-weak);color:var(--warn);font-weight:600}
.chip.ms{background:var(--accent-weak);color:var(--accent);font-weight:600}
.quick{display:flex;gap:8px;padding:8px 10px 10px}
.quick input{flex:1;min-width:0;border:1px dashed var(--border);background:transparent;border-radius:10px;padding:8px 12px;font-size:16px}
.quick input:focus{outline:none;border-style:solid;border-color:var(--accent);background:var(--bg)}
.add-sec{width:100%;border:1px dashed var(--border);background:transparent;border-radius:14px;padding:12px;color:var(--accent);font-weight:600}
.add-sec:hover{background:var(--surface)}
.hidden-note{font-size:12.5px;color:var(--faint);padding:8px 16px;border-bottom:1px solid var(--border)}

/* Panel */
.scrim{position:fixed;inset:0;background:rgba(10,8,5,.28);z-index:40;animation:fade .15s}
.panel{position:fixed;top:0;right:0;bottom:0;width:min(500px,100%);background:var(--surface);z-index:41;display:flex;flex-direction:column;box-shadow:var(--panel-shadow)}
.panel.anim{animation:slide .18s ease-out}
@keyframes fade{from{opacity:0}}
@keyframes slide{from{transform:translateX(24px);opacity:.4}}
.panel-head{display:flex;align-items:center;gap:6px;padding:8px 8px 8px 16px;padding-top:calc(8px + env(safe-area-inset-top));border-bottom:1px solid var(--border)}
.crumbs{flex:1;min-width:0;font-size:13px;color:var(--muted);display:flex;align-items:center;gap:4px;overflow:hidden;white-space:nowrap}
.crumbs button{border:0;background:none;padding:3px 5px;border-radius:6px;color:var(--muted);max-width:180px;overflow:hidden;text-overflow:ellipsis;font-size:13px}
.crumbs button:hover{background:var(--surface-2);color:var(--text)}
.panel-body{flex:1;overflow:auto;padding:16px 18px calc(28px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}
.title-row{display:flex;gap:10px;align-items:flex-start;margin-bottom:14px}
.title-row .check{width:26px;height:26px;margin-top:6px}
.title-input{flex:1;border:1px solid transparent;background:transparent;font-size:20px;font-weight:650;letter-spacing:-.01em;padding:4px 6px;border-radius:8px;resize:none;overflow:hidden;min-height:0;line-height:1.3}
.title-input:hover{border-color:var(--border)}
.title-input:focus{outline:none;border-color:var(--accent);background:var(--bg)}
.ps{margin-top:22px}
.ps h4{font-size:12.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:10px;display:flex;align-items:center;gap:6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
.grid2 .full{grid-column:1/-1}
.fld label,.fld .lbl{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:4px}
.fld .hint{font-size:12px;color:var(--faint);margin-top:3px}
.date-wrap{position:relative}
.date-wrap .clear{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:28px;height:28px}
input[type=date].inp{padding-right:34px}
.warn{margin-top:10px;padding:8px 12px;border-radius:10px;background:var(--warn-weak);color:var(--warn);font-size:13.5px}
.sublist,.linklist{list-style:none;margin:0 0 10px;padding:0;border:1px solid var(--border);border-radius:12px;overflow:hidden}
.sublist:empty,.linklist:empty{display:none}
.sublist li,.linklist li{display:flex;align-items:center;gap:10px;padding:8px 8px 8px 12px;border-bottom:1px solid var(--border)}
.sublist li:last-child,.linklist li:last-child{border-bottom:0}
.sublist .check{width:20px;height:20px}
.sublist .open,.linklist .open{flex:1;min-width:0;border:0;background:none;text-align:left;padding:2px 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sublist li.done .open{text-decoration:line-through;color:var(--muted)}
.linklist .ltype{font-size:11.5px;font-weight:700;color:var(--accent);background:var(--accent-weak);padding:3px 7px;border-radius:6px;white-space:nowrap;flex:none}
.linklist .ltype.rel{color:var(--muted);background:var(--surface-2)}
.linklist .lmeta{display:block;font-size:12px;color:var(--muted)}
.linklist .lwarn{display:block;font-size:12px;color:var(--warn);font-weight:600}
.linklist .open{white-space:normal}
.link-add{border:1px solid var(--border);border-radius:12px;padding:10px;background:var(--bg)}
.link-add .inp{background:var(--surface)}
.results{list-style:none;margin:8px 0 0;padding:0;max-height:260px;overflow:auto}
.results li button{width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:8px;display:flex;gap:8px;align-items:center}
.results li button:hover{background:var(--surface-2)}
.results .rp{font-size:12px;color:var(--muted);margin-left:auto;white-space:nowrap;display:flex;align-items:center;gap:5px}
.results .rp .dot{width:7px;height:7px}
.results .none{padding:8px 10px;color:var(--faint);font-size:13.5px}
.panel-foot{margin-top:28px;padding-top:16px;border-top:1px solid var(--border);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.panel-foot .meta{font-size:12px;color:var(--faint);width:100%;margin-top:6px}

/* Modal, sheet, toast */
.modal-wrap{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:16px;background:rgba(10,8,5,.38);animation:fade .12s}
.modal{background:var(--surface);border-radius:16px;width:min(440px,100%);max-height:88vh;overflow:auto;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal h3{font-size:18px;margin-bottom:10px}
.modal-body{color:var(--muted);font-size:14.5px}
.modal-body p{margin:0 0 10px}
.modal-body .fld{margin-bottom:12px}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;flex-wrap:wrap}
.sheet .modal-actions{flex-direction:column-reverse;align-items:stretch}
.sheet .modal-actions .btn{justify-content:center;padding:11px}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatches label{width:32px;height:32px;border-radius:50%;background:var(--c);cursor:pointer;display:grid;place-items:center;position:relative}
.swatches input{position:absolute;opacity:0}
.swatches input:checked + span{width:12px;height:12px;border-radius:50%;background:#fff}
.swatches input:focus-visible + span{outline:2px solid var(--text)}
.cmp{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px;margin:10px 0;color:var(--text)}
.cmp dt{color:var(--muted)}
.cmp dd{margin:0}
.toast-root{position:fixed;left:0;right:0;bottom:calc(18px + env(safe-area-inset-bottom));display:flex;justify-content:center;z-index:80;pointer-events:none;padding:0 16px}
.toast{background:var(--text);color:var(--bg);padding:10px 14px 10px 16px;border-radius:12px;font-size:14px;box-shadow:0 8px 30px rgba(0,0,0,.25);display:flex;gap:12px;align-items:center;pointer-events:auto;animation:up .18s ease-out}
.toast button{border:0;background:none;color:var(--bg);font-weight:700;text-decoration:underline;padding:0}
@keyframes up{from{transform:translateY(10px);opacity:0}}

/* Settings */
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px 18px;margin-bottom:14px;box-shadow:var(--shadow)}
.card h3{font-size:16px;margin-bottom:4px}
.card > p{margin:0 0 12px;color:var(--muted);font-size:14px}
.card.danger h3{color:var(--danger)}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:10px;overflow:hidden;background:var(--bg)}
.seg button{border:0;background:transparent;padding:7px 16px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--accent-weak);color:var(--accent)}
.order{list-style:none;margin:0 0 10px;padding:0;border:1px solid var(--border);border-radius:12px;overflow:hidden;max-width:420px}
.order li{display:flex;align-items:center;gap:6px;padding:6px 6px 6px 14px;border-bottom:1px solid var(--border);background:var(--surface)}
.order li:last-child{border-bottom:0}
.order li .n{color:var(--faint);font-size:13px;width:18px}
.order li .l{flex:1;font-weight:600}
.order li.fixed{background:var(--bg);color:var(--muted)}
.order li.fixed .l{font-weight:500}
.kv{font-size:14px;margin:0 0 14px;display:grid;grid-template-columns:auto 1fr;gap:4px 14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0}
.sub{font-size:14px;font-weight:650;margin:16px 0 8px}
.code-box{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px !important;min-height:70px !important;word-break:break-all}
.backups{list-style:none;margin:0;padding:0}
.backups li{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--border);font-size:14px}
.backups li:last-child{border-bottom:0}
.backups li div{flex:1;min-width:0}
.backups small{display:block;color:var(--muted);font-size:12.5px}
.about{text-align:center;color:var(--faint);font-size:12.5px;margin-top:22px}
.okline{font-size:13px;color:var(--accent);font-weight:600}
.warnline{font-size:13px;color:var(--warn);font-weight:600}

/* Kanban */
.hint-sm{font-size:13px;color:var(--faint)}
.board{display:flex;gap:12px;overflow-x:auto;padding:2px 2px 14px;align-items:flex-start;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch}
.kcol{flex:0 0 276px;background:var(--surface-2);border:1px solid var(--border);border-radius:14px;display:flex;flex-direction:column;max-height:calc(100vh - 200px);max-height:calc(100dvh - 200px);scroll-snap-align:start}
.kcol-head{display:flex;align-items:center;gap:6px;padding:9px 6px 6px 14px}
.kcol-head h3{flex:1;min-width:0;font-size:14px;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kcol-head .count{font-size:12.5px;color:var(--faint);font-weight:600;min-width:14px;text-align:right}
.kdone{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:700;color:var(--accent);background:var(--accent-weak);padding:2px 7px 2px 5px;border-radius:99px}
.kdone svg{width:11px;height:11px}
.kcards{display:flex;flex-direction:column;gap:8px;padding:4px 8px 6px;overflow-y:auto;min-height:44px;flex:1}
.kcard{background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--pc,var(--accent));border-radius:10px;padding:9px 11px;box-shadow:var(--shadow);cursor:grab;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.kcard:hover{border-color:var(--faint);border-left-color:var(--pc,var(--accent))}
.kcard .ktitle{font-weight:550;word-break:break-word}
.kcard.done .ktitle{text-decoration:line-through;color:var(--muted)}
.kparent{display:flex;align-items:center;gap:4px;font-size:11.5px;color:var(--muted);margin-bottom:3px;white-space:nowrap;overflow:hidden}
.kparent svg{width:11px;height:11px;flex:none}
.kparent span{overflow:hidden;text-overflow:ellipsis}
.kplaceholder{opacity:.3;border-style:dashed}
.kghost{position:fixed;z-index:90;pointer-events:none;transform:rotate(2deg) scale(1.02);box-shadow:0 14px 34px rgba(0,0,0,.28);margin:0;cursor:grabbing}
.kquick{padding:6px 8px 10px}
.kquick input{background:var(--surface)}
.kcol-add{flex:0 0 200px;border:1px dashed var(--border);background:transparent;color:var(--accent);font-weight:600;min-height:52px;align-items:center;justify-content:center;box-shadow:none}
.kcol-add:hover{background:var(--surface)}
body.dragging,body.dragging *{cursor:grabbing !important;user-select:none;-webkit-user-select:none}

/* Gantt */
.gtools .seg button{padding:6px 12px}
.gantt{--nameW:250px;position:relative;overflow:auto;border:1px solid var(--border);border-radius:14px;background:var(--surface);max-height:calc(100vh - 230px);max-height:calc(100dvh - 230px);-webkit-overflow-scrolling:touch;overscroll-behavior:contain;box-shadow:var(--shadow)}
.g-inner{position:relative;min-width:100%}
.g-head{position:sticky;top:0;z-index:8;display:flex;background:var(--surface);border-bottom:1px solid var(--border)}
.g-corner{position:sticky;left:0;z-index:9;width:var(--nameW);flex:none;background:var(--surface);border-right:1px solid var(--border);padding:0 12px 7px;font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;display:flex;align-items:flex-end}
.g-scale{position:relative;height:50px;flex:none}
.g-scale .gt,.g-scale .gb{position:absolute;left:0;right:0;height:25px}
.g-scale .gb{top:25px;border-top:1px solid var(--border)}
.g-scale .cell{position:absolute;top:0;height:25px;border-left:1px solid var(--border);font-size:11.5px;color:var(--muted);padding:5px 6px;white-space:nowrap;overflow:hidden;font-weight:600}
.g-scale .gt .cell{overflow:clip}
.g-scale .gt .cell .sl{position:sticky;left:calc(var(--nameW) + 6px)}
.g-scale .gb .cell{text-align:center;padding:5px 0;font-weight:500}
.g-scale .cell.we{color:var(--faint)}
.g-scale .cell.today{color:var(--on-accent);background:var(--accent);font-weight:700;border-radius:6px;border-left-color:transparent}
.g-body{position:relative}
.g-grid{position:absolute;top:0;bottom:0;left:var(--nameW);pointer-events:none}
.g-grid .gl{position:absolute;top:0;bottom:0;width:1px;background:var(--border)}
.g-grid .gl.strong{background:var(--faint);opacity:.5}
.g-grid .we{position:absolute;top:0;bottom:0;background:var(--surface-2);opacity:.6}
.g-grid .now{position:absolute;top:0;bottom:0;width:2px;background:var(--accent);opacity:.75;z-index:1}
.g-arrows{position:absolute;top:0;left:var(--nameW);pointer-events:none;z-index:2;overflow:visible}
.g-arrows path{fill:none;stroke:var(--muted);stroke-width:1.5;opacity:.85}
.g-arrows path.bad{stroke:var(--danger);opacity:1;stroke-width:1.8}
.g-row{display:flex;height:38px;position:relative}
.g-name{position:sticky;left:0;z-index:6;width:var(--nameW);flex:none;background:var(--surface);border-right:1px solid var(--border);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:2px;padding-right:6px;overflow:hidden}
.g-row:hover .g-name{background:var(--surface-2)}
.g-row.prow .g-name{background:var(--bg)}
.g-row.prow .g-title{font-weight:700}
.g-row.prow .dot{margin:0 2px 0 2px}
.g-toggle{width:24px;height:24px;border:0;background:none;color:var(--muted);display:grid;place-items:center;border-radius:6px;flex:none;padding:0}
.g-toggle:hover{background:var(--surface-2);color:var(--text)}
.g-toggle svg{transition:transform .12s}
.g-toggle.open svg{transform:rotate(90deg)}
.g-sp{width:24px;flex:none}
.g-title{border:0;background:none;padding:3px 5px;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0;font-size:13.5px;border-radius:6px}
.g-title:hover{background:var(--surface-2)}
.g-row.done .g-title{text-decoration:line-through;color:var(--muted)}
.g-track{position:relative;flex:none;border-bottom:1px solid var(--border);border-bottom-color:color-mix(in srgb,var(--border) 55%,transparent)}
.g-track.undated{cursor:cell}
.g-track.undated:hover{background:color-mix(in srgb,var(--accent-weak) 50%,transparent)}
.g-bar{position:absolute;top:9px;height:20px;border-radius:6px;background:var(--pc);z-index:3;cursor:grab;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;min-width:8px;box-shadow:0 1px 2px rgba(0,0,0,.18)}
.g-bar:hover{filter:brightness(1.08)}
.g-bar.done{opacity:.45}
.g-bar.dragging,.g-ms.dragging{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--pc),0 6px 18px rgba(0,0,0,.25);z-index:5}
.g-bar.summary{top:12px;height:12px;border-radius:3px;background:color-mix(in srgb,var(--pc) 55%,var(--text));--sc:color-mix(in srgb,var(--pc) 55%,var(--text))}
.g-bar.summary::before,.g-bar.summary::after{content:"";position:absolute;bottom:-5px;border-top:5px solid var(--sc,var(--pc));border-left:4px solid transparent;border-right:4px solid transparent}
.g-bar.summary::before{left:0;border-left:0}
.g-bar.summary::after{right:0;border-right:0}
.g-bar.project{top:14px;height:10px;border-radius:5px;opacity:.45;cursor:default;box-shadow:none;z-index:3}
.g-h{position:absolute;top:-2px;bottom:-2px;width:10px;cursor:ew-resize;z-index:4}
.g-h.l{left:-3px}.g-h.r{right:-3px}
.g-bar:hover .g-h::after{content:"";position:absolute;top:6px;bottom:6px;left:4px;width:2px;border-radius:1px;background:rgba(255,255,255,.75)}
.g-ms{position:absolute;top:11px;width:16px;height:16px;transform:rotate(45deg);background:var(--surface);border:3px solid color-mix(in srgb,var(--pc) 70%,var(--text));z-index:4;border-radius:3px;box-shadow:0 0 0 2px var(--surface),0 1px 4px rgba(0,0,0,.3)}
.g-ms.drag{cursor:grab}
.g-ms.done{background:color-mix(in srgb,var(--pc) 70%,var(--text))}
.g-lbl{position:absolute;top:10px;font-size:12px;color:var(--muted);white-space:nowrap;pointer-events:none;z-index:3}
.g-dl{position:absolute;top:4px;bottom:4px;width:2px;background:var(--danger);opacity:.55;z-index:3;border-radius:1px;pointer-events:auto}
.g-dl::before{content:"";position:absolute;top:0;left:2px;border-left:7px solid var(--danger);border-top:4px solid transparent;border-bottom:4px solid transparent}
.g-dl.overdue,.g-dl.soon{opacity:1}
.g-tip{position:fixed;z-index:95;background:var(--text);color:var(--bg);font-size:12.5px;padding:5px 9px;border-radius:8px;pointer-events:none;white-space:nowrap;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.25)}
@media (pointer:coarse){.g-h{width:20px}.g-h.l{left:-10px}.g-h.r{right:-10px}}
/* Chart palette (validated reference palette) */
:root{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4;--s6:#008300;--s7:#6250d6;--s8:#e34948;
  --st-good:#0ca30c;--st-warn:#fab219;--st-serious:#ec835a;--st-crit:#d03b3b;--st-none:#a19b90}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#008300;--s7:#9085e9;--s8:#e66767;--st-none:#6e695f}}
:root[data-theme="dark"]{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#008300;--s7:#9085e9;--s8:#e66767;--st-none:#6e695f}

.modal.wide{width:min(580px,100%)}
.modal-actions .left{margin-right:auto}

/* Diary */
.dsearch{max-width:300px}
.diary{max-width:760px}
.dmonth{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:22px 0 10px}
.dmonth:first-child{margin-top:4px}
.dentry{display:flex;gap:14px;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px 16px;margin-bottom:10px;box-shadow:var(--shadow);cursor:pointer}
.dentry:hover{border-color:var(--faint)}
.ddate{flex:none;width:44px;text-align:center;padding-top:2px}
.ddate b{display:block;font-size:22px;line-height:1;font-weight:700;letter-spacing:-.02em}
.ddate span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.dbody{flex:1;min-width:0}
.dbody h4{font-size:15.5px;margin-bottom:4px}
.dbody p{margin:0;white-space:pre-wrap;word-break:break-word;color:var(--text);display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden}
.rchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.rchips:empty{display:none}
.rchip{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;padding:3px 9px;border-radius:99px;background:var(--surface-2);color:var(--text);max-width:100%;overflow:hidden;white-space:nowrap}
.rchip[role=button]{cursor:pointer}
.rchip[role=button]:hover{background:var(--accent-weak)}
.rchip .dot{width:8px;height:8px}
.rchip .rp{color:var(--muted)}
.rchip.general{color:var(--muted)}
.rchip svg{flex:none;color:var(--muted)}
.rchip .rx{border:0;background:none;padding:0 0 0 2px;color:var(--muted);display:grid;place-items:center}
.rchip .rx:hover{color:var(--danger)}
.pdiary{list-style:none;margin:0 0 10px;padding:0}
.pdiary li button{width:100%;text-align:left;border:1px solid var(--border);background:var(--bg);border-radius:10px;padding:8px 12px;margin-bottom:6px;display:block}
.pdiary li button:hover{border-color:var(--faint)}
.pdiary small{display:block;color:var(--muted);font-size:12px}
.pdiary span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Milestones in task panel */
.ps h4 svg{color:var(--accent)}
.mslist{list-style:none;margin:12px 0 10px;padding:0;display:flex;flex-direction:column;gap:8px}
.msrow{display:grid;grid-template-columns:auto minmax(0,1fr) 172px auto;gap:8px;align-items:center}
.msrow .check{width:22px;height:22px}
.msrow.done input[data-ms=name]{text-decoration:line-through;color:var(--muted)}
.msnote{grid-column:2/-1;font-size:12px;color:var(--danger);font-weight:600;margin-top:-4px}
.chip.ms.overdue{background:var(--danger-weak);color:var(--danger)}
.ci.k-milestone svg{color:var(--pc,var(--accent))}
.ci.k-milestone.overdue{background:var(--danger-weak)}
.ci.k-milestone.overdue svg{color:var(--danger)}
@media (max-width:560px){.msrow{grid-template-columns:auto minmax(0,1fr) auto}.msrow .msdate{grid-column:2/3;grid-row:2}.msnote{grid-column:2/3}.cal-dots i.ms{border-radius:1px;transform:rotate(45deg);width:5px;height:5px}}

/* Project dates */
.title{flex-wrap:wrap;row-gap:0}
.pdates{border:0;background:none;padding:2px 6px;border-radius:6px;font-size:13px;font-weight:500;color:var(--muted);white-space:nowrap}
.pdates:hover{background:var(--surface-2);color:var(--text)}
.g-plan{position:absolute;top:7px;height:24px;border:2px dashed var(--pc);border-radius:7px;z-index:2;cursor:pointer;background:color-mix(in srgb,var(--pc) 8%,transparent)}
.g-plan:hover{background:color-mix(in srgb,var(--pc) 16%,transparent)}
.g-setp{position:sticky;left:calc(var(--nameW) + 8px);top:8px;margin:8px;border:1px dashed var(--border);background:var(--surface);color:var(--accent);font-weight:600;font-size:12.5px;padding:3px 10px;border-radius:8px;z-index:3}
.ci.k-proj{background:color-mix(in srgb,var(--pc) 22%,var(--surface));font-weight:600;border-left-width:4px}
.ci.k-pdl{border-left-color:var(--danger)}
.ci.k-pdl svg{color:var(--danger)}
.ci.k-pdl.overdue{background:var(--danger-weak);color:var(--danger)}
@media (max-width:560px){.pdates{display:none}.cal-dots i.pj{border-radius:1px;width:8px;height:4px}}

/* Goals & people */
.rename-inline{border:0;background:none;padding:2px 4px;margin:0 -4px;border-radius:6px;font:inherit;color:inherit;font-weight:700;cursor:text}
.rename-inline:hover{background:var(--surface-2)}
.pgroup-head.static{cursor:default}
.pgroup-head.static:hover{background:none}
.pgroup-head.static svg{color:var(--accent)}
.task.goal .check{border-radius:50%}
.ci.k-goal svg{color:var(--accent)}
.people{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.people .inp{flex:1;min-width:180px}
.people .rchip{padding:6px 6px 6px 10px;font-size:13.5px}
.fld .hint{font-size:12px;color:var(--faint);margin-top:3px}

/* Calendar */
.caltools{align-items:center}
.cal-label{font-size:18px;min-width:0;margin:0 2px}
.cal{background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden;box-shadow:var(--shadow)}
.cal-head{display:grid;grid-template-columns:repeat(7,1fr);border-bottom:1px solid var(--border);background:var(--bg)}
.cal-head div{padding:8px 10px;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.cal-day{min-height:118px;border-right:1px solid var(--border);border-bottom:1px solid var(--border);padding:6px 6px 8px;cursor:pointer;min-width:0}
.cal-day:nth-child(7n){border-right:0}
.cal-day:hover{background:var(--bg)}
.cal-day.out{background:color-mix(in srgb,var(--surface-2) 45%,transparent)}
.cal-day.out .cal-num{color:var(--faint)}
.cal-day.sel{box-shadow:inset 0 0 0 2px var(--accent)}
.cal-num{font-size:13px;font-weight:650;width:26px;height:26px;display:grid;place-items:center;border-radius:50%;margin-bottom:4px}
.cal-day.today .cal-num{background:var(--accent);color:var(--on-accent)}
.cal-items{display:flex;flex-direction:column;gap:3px}
.ci{display:flex;align-items:center;gap:5px;font-size:12px;line-height:1.25;padding:3px 6px;border-radius:6px;background:color-mix(in srgb,var(--pc,var(--accent)) 14%,var(--surface));border-left:3px solid var(--pc,var(--accent));overflow:hidden;white-space:nowrap;cursor:pointer;color:var(--text)}
.ci span{overflow:hidden;text-overflow:ellipsis;min-width:0}
.ci svg{width:11px;height:11px;flex:none}
.ci em{font-style:normal;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;flex:none}
.ci small{margin-left:auto;color:var(--muted);font-size:11.5px;flex:none;padding-left:8px}
.ci:hover{filter:brightness(.97)}
.ci.done span{text-decoration:line-through;color:var(--muted)}
.ci.k-ongoing{background:transparent;border-left-style:dotted;color:var(--muted)}
.ci.k-end{background:transparent}
.ci.k-deadline{background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--danger);color:var(--text)}
.ci.k-deadline svg{color:var(--danger)}
.ci.k-deadline.overdue{background:var(--danger-weak);color:var(--danger);font-weight:600}
.ci.k-diary{background:var(--surface-2);border-left-color:var(--faint);color:var(--muted)}
.cal-more{font-size:11.5px;color:var(--muted);font-weight:600;padding:1px 6px}
.cal-dots{display:none}
.dayd{margin-top:14px}
.day-items{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.day-items .ci,.cw-items .ci{font-size:13.5px;padding:7px 10px;white-space:normal}
.day-items .ci span,.cw-items .ci span{white-space:normal}
.calweek{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.cw-day{background:var(--surface);border:1px solid var(--border);border-radius:12px;display:flex;flex-direction:column;min-height:200px;box-shadow:var(--shadow);min-width:0}
.cw-day.today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.cw-head{display:flex;align-items:baseline;gap:6px;padding:8px 10px;border-bottom:1px solid var(--border);cursor:pointer}
.cw-head b{font-size:18px}
.cw-head span{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cw-day.today .cw-head b{color:var(--accent)}
.cw-items{display:flex;flex-direction:column;gap:5px;padding:8px;flex:1}
.cw-items .ci{font-size:12.5px;padding:5px 7px;flex-wrap:wrap}
.cw-items .ci small{margin-left:0;padding-left:0;width:100%}
.cw-empty{color:var(--faint);font-size:13px;padding:2px}
.cw-add{border:0;border-top:1px solid var(--border);background:none;color:var(--accent);font-weight:600;font-size:13px;padding:7px;border-radius:0 0 12px 12px}
.cw-add:hover{background:var(--bg)}

/* Stats */
.statools{justify-content:flex-start}
.statools .seg{overflow-x:auto;max-width:100%}
.statools .seg button{white-space:nowrap}
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:2px}
.kpi span{font-size:12.5px;color:var(--muted);font-weight:600}
.kpi b{font-size:28px;font-weight:700;letter-spacing:-.02em;line-height:1.15}
.kpi b em{font-style:normal;font-size:18px;color:var(--muted);font-weight:600}
.kpi small{font-size:12px;color:var(--faint)}
.kpi .bar{margin:4px 0 2px}
.kpi.alert b{color:var(--danger)}
.cgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.ccard{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px 16px 16px;box-shadow:var(--shadow);min-width:0}
.ccard-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.ccard-head h3{font-size:15.5px}
.csub{margin:2px 0 0;font-size:13px;color:var(--muted)}
.seg.sm button{padding:4px 10px;font-size:12.5px}
.cempty{color:var(--faint);font-size:14px;margin:18px 0;text-align:center}
.tchart{display:flex;gap:8px;height:170px}
.ty{display:flex;flex-direction:column;justify-content:space-between;font-size:11px;color:var(--faint);text-align:right;min-width:18px;margin:-6px 0}
.tplot{position:relative;flex:1;min-width:0}
.tg{position:absolute;left:0;right:0;height:1px;background:var(--border)}
.tbars{position:absolute;inset:0;display:flex;align-items:flex-end;gap:3px}
.tcol{flex:1;height:100%;display:flex;align-items:flex-end;min-width:0;cursor:default}
.tcol:hover .tbar{filter:brightness(1.1)}
.tbar{width:100%;max-width:38px;margin:0 auto;background:var(--s1);border-radius:4px 4px 0 0;min-height:0}
.tx{display:flex;gap:3px;margin-left:26px;margin-top:6px}
.tx span{flex:1;font-size:11px;color:var(--faint);text-align:center;white-space:nowrap;overflow:visible;min-width:0}
.tline{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.tline path{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.tdot{position:absolute;width:9px;height:9px;margin:-4.5px 0 0 -4.5px;border-radius:50%;background:var(--c);border:2px solid var(--surface)}
.tdot::after{content:"";position:absolute;inset:-8px}
.tends{position:absolute;top:0;bottom:0;right:-4px;pointer-events:none}
.tends .tend{display:none}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin:-4px 0 10px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:14px;height:3px;border-radius:2px;display:inline-block}
.hbars{display:flex;flex-direction:column;gap:8px}
.hb{display:grid;grid-template-columns:minmax(110px,40%) 1fr 34px;gap:10px;align-items:center;font-size:13.5px}
.hl{display:flex;align-items:center;gap:7px;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;color:var(--text)}
.hl i,.dleg i,.pbt i{width:10px;height:10px;border-radius:3px;flex:none;display:inline-block}
.ht{height:14px;background:var(--surface-2);border-radius:4px;overflow:hidden}
.hbar{display:block;height:100%;border-radius:4px}
.hv{text-align:right;font-weight:650;font-variant-numeric:tabular-nums}
.donut{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.donut circle{cursor:default}
.dnum{font-size:22px;font-weight:700;fill:var(--text)}
.dlbl{font-size:10px;fill:var(--muted)}
.dleg{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:13.5px;flex:1;min-width:150px}
.dleg li{display:flex;align-items:center;gap:8px}
.dleg span{flex:1}
.dleg b{font-variant-numeric:tabular-nums}
.pbars{display:flex;flex-direction:column;gap:12px}
.pbt{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;margin-bottom:5px}
.pbt span{display:flex;align-items:center;gap:7px;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.pb small{font-size:12px;color:var(--faint);display:block;margin-top:3px}
.rings{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:14px}
.ring{display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px;font-size:13px}
.ring span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ring small{color:var(--faint);font-size:12px}
.rnum{font-size:13px;font-weight:700;fill:var(--text)}
.dtable{width:100%;border-collapse:collapse;font-size:13.5px}
.dtable th{text-align:left;font-size:12px;color:var(--muted);font-weight:600;border-bottom:1px solid var(--border);padding:6px 8px}
.dtable td{padding:6px 8px;border-bottom:1px solid var(--border)}
.dtable .num{text-align:right;font-variant-numeric:tabular-nums}
.dtable tr:last-child td{border-bottom:0}
@media (max-width:900px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}.cgrid{grid-template-columns:1fr}.calweek{grid-template-columns:1fr}.cw-day{min-height:0}}
@media (max-width:560px){
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .cal-day{min-height:58px;padding:4px 2px;text-align:center}
  .cal-num{margin:0 auto 2px;font-size:12.5px;width:24px;height:24px}
  .cal-items{display:none}
  .cal-dots{display:flex;flex-wrap:wrap;justify-content:center;gap:3px}
  .cal-dots i{width:6px;height:6px;border-radius:50%;background:var(--pc,var(--accent))}
  .cal-dots i.dl{background:var(--danger)}
  .cal-dots i.dd{background:var(--faint)}
  .cal-head div{padding:6px 2px;text-align:center;font-size:11px}
  .cal-label{font-size:16px}
  .hb{grid-template-columns:minmax(90px,42%) 1fr 30px}
  .dsearch{max-width:none;flex:1}
}

@media (max-width:560px){
  .gantt{--nameW:132px}
  .kcol{flex-basis:262px}
  .grid2{grid-template-columns:1fr}
  .wrap{padding:12px 12px calc(80px + env(safe-area-inset-bottom))}
  .pgrid{grid-template-columns:1fr}
  .task{padding-left:calc(12px + var(--depth,0)*20px)}
  .panel{width:100%}
  .panel-body{padding:14px 14px calc(28px + env(safe-area-inset-bottom))}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="panel-root"></div>
<div id="modal-root"></div>
<div id="toast-root" class="toast-root"></div>
<script>
(function(){
'use strict';

/* ---------- Constants ---------- */
var DATA_KEY='projectPlanner.data.v1', BACKUP_KEY='projectPlanner.backups.v1', UI_KEY='projectPlanner.ui.v1', DEVICE_KEY='projectPlanner.device.v1';
var TAB_LABELS={projects:'Projects',todo:'To Do',goals:'Goals',kanban:'Kanban',gantt:'Gantt',diary:'Diary',calendar:'Calendar',stats:'Stats'};
var DEFAULT_TABS=['todo','goals','kanban','gantt','diary','calendar','stats'];
var COLORS=['#2f6f6a','#3b5ba5','#7d4fa3','#b5476b','#c0622f','#a8841c','#4f8a3c','#5f6b7a'];
var MAX_BACKUPS=6;

var ICON={
  gear:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>',
  back:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>',
  close:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  check:'<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  more:'<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>',
  link:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/></svg>',
  person:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>',
  target:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.2" fill="currentColor"/></svg>',
  edit:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/></svg>',
  note:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16M4 10h16M4 15h10"/></svg>',
  flag:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V4m0 0h11l-2 4 2 4H5"/></svg>',
  diamond:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l10 10-10 10L2 12z"/></svg>',
  cal:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
  sub:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4v10a3 3 0 0 0 3 3h9m-3-3l3 3-3 3"/></svg>',
  up:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15l6-6 6 6"/></svg>',
  down:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>',
  x:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  chev:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>'
};

/* ---------- Utilities ---------- */
function labels(){var l=state.settings.labels;if(!l||typeof l!=='object'){l=state.settings.labels={}}if(!l.tabs||typeof l.tabs!=='object')l.tabs={};return l}
function tabLabel(t){var v=labels().tabs[t];return v&&String(v).trim()?String(v):TAB_LABELS[t]}
function umbrellaTitle(){var v=labels().umbrella;return v&&String(v).trim()?String(v):'All projects'}
function overallGoalsTitle(){var v=labels().overallGoals;return v&&String(v).trim()?String(v):'Overall goals'}
function $(s,r){return (r||document).querySelector(s)}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,9)}
function nowISO(){return new Date().toISOString()}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function pad(n){return String(n).padStart(2,'0')}
function isoOf(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function today(){return isoOf(new Date())}
function parseISO(s){var a=s.split('-').map(Number);return new Date(a[0],a[1]-1,a[2])}
function addDays(s,n){var d=parseISO(s);d.setDate(d.getDate()+n);return isoOf(d)}
function daysFromToday(s){return Math.round((parseISO(s)-parseISO(today()))/864e5)}
function fmtDate(s){
  if(!s)return '';
  var d=parseISO(s),o={day:'numeric',month:'short'};
  if(d.getFullYear()!==new Date().getFullYear())o.year='numeric';
  return d.toLocaleDateString(undefined,o);
}
function fmtExact(ts){if(!ts)return 'unknown';return new Date(ts).toLocaleString(undefined,{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit',second:'2-digit'})}
function fmtStamp(ts){
  if(!ts)return 'never';
  return new Date(ts).toLocaleString(undefined,{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});
}
function plural(n,w){return n+' '+w+(n===1?'':'s')}
function byOrder(a,b){return (a.order||0)-(b.order||0)||(a.createdAt<b.createdAt?-1:a.createdAt>b.createdAt?1:0)}

var storageOK=true;
function lsGet(k){try{return localStorage.getItem(k)}catch(e){storageOK=false;return null}}
function lsSet(k,v){try{localStorage.setItem(k,v);return true}catch(e){storageOK=false;return false}}
function lsJSON(k,fallback){var r=lsGet(k);if(!r)return fallback;try{return JSON.parse(r)}catch(e){return fallback}}
(function(){try{localStorage.setItem('__pp','1');localStorage.removeItem('__pp')}catch(e){storageOK=false}})();

/* ---------- State ---------- */
function defaultColumns(){return [{id:uid(),name:'To Do'},{id:uid(),name:'In Progress'},{id:uid(),name:'Done'}]}
function emptyState(){
  return {app:'project-planner',schema:1,updatedAt:nowISO(),settings:{tabOrder:DEFAULT_TABS.slice()},projects:[],tasks:[],links:[],diary:[],goals:[],goalSections:[{id:uid(),name:'Goals'}]};
}
function normalize(s){
  var b=emptyState();
  s=s&&typeof s==='object'?s:{};
  var out={app:'project-planner',schema:1,updatedAt:s.updatedAt||b.updatedAt,settings:Object.assign({},b.settings,s.settings||{}),
    projects:Array.isArray(s.projects)?s.projects:[],tasks:Array.isArray(s.tasks)?s.tasks:[],links:Array.isArray(s.links)?s.links:[],diary:Array.isArray(s.diary)?s.diary:[],goals:Array.isArray(s.goals)?s.goals:[],goalSections:Array.isArray(s.goalSections)&&s.goalSections.length?s.goalSections:[{id:uid(),name:'Goals'}]};
  var to=(out.settings.tabOrder||[]).filter(function(t,i,a){return DEFAULT_TABS.indexOf(t)>-1&&a.indexOf(t)===i});
  DEFAULT_TABS.forEach(function(t,i){if(to.indexOf(t)<0){var prev=DEFAULT_TABS[i-1],at=prev?to.indexOf(prev)+1:0;to.splice(at,0,t)}});
  out.settings.tabOrder=to;
  var lb=out.settings.labels&&typeof out.settings.labels==='object'?out.settings.labels:{};out.settings.labels={umbrella:typeof lb.umbrella==='string'?lb.umbrella:'',overallGoals:typeof lb.overallGoals==='string'?lb.overallGoals:'',tabs:{}};
  if(lb.tabs&&typeof lb.tabs==='object')Object.keys(lb.tabs).forEach(function(k){if(TAB_LABELS[k]&&typeof lb.tabs[k]==='string')out.settings.labels.tabs[k]=lb.tabs[k]});
  out.projects.forEach(function(p,i){
    if(!p.id)p.id=uid();
    p.name=p.name||'Untitled project';
    if(!Array.isArray(p.sections)||!p.sections.length)p.sections=[{id:uid(),name:'General'}];
    if(!Array.isArray(p.columns)||!p.columns.length)p.columns=defaultColumns();
    if(!p.color)p.color=COLORS[i%COLORS.length];
    ['startDate','endDate','deadline'].forEach(function(k){if(!p[k])p[k]=''});
    if(!Array.isArray(p.goalSections)||!p.goalSections.length)p.goalSections=[{id:uid(),name:'Goals'}];
    if(p.order==null)p.order=i+1;
    if(p.doneColumnId===undefined)p.doneColumnId=p.columns.length>1?p.columns[p.columns.length-1].id:null;
  });
  var pids={};out.projects.forEach(function(p){pids[p.id]=1});
  out.tasks=out.tasks.filter(function(t){return t&&t.id&&pids[t.projectId]});
  out.tasks.forEach(function(t){
    t.title=t.title||'Untitled';t.notes=t.notes||'';
    ['startDate','endDate','deadline'].forEach(function(k){if(!t[k])t[k]=''});
    if(!Array.isArray(t.milestones)){t.milestones=t.milestone?[{id:uid(),name:t.title,date:t.endDate||t.startDate||t.deadline||'',done:!!t.done,doneAt:t.doneAt||null}]:[]}
    t.milestones=t.milestones.filter(function(m){return m&&m.id});t.milestones.forEach(function(m){m.name=m.name||'Milestone';m.date=m.date||'';m.done=!!m.done;m.doneAt=m.doneAt||null});
    delete t.milestone;t.done=!!t.done;t.parentId=t.parentId||null;
    if(!t.createdAt)t.createdAt=nowISO();if(!t.updatedAt)t.updatedAt=t.createdAt;
  });
  var pmap={};out.projects.forEach(function(p){pmap[p.id]=p});
  out.tasks.forEach(function(t){
    var p=pmap[t.projectId],ids=p.columns.map(function(c){return c.id});
    if(ids.indexOf(t.columnId)<0)t.columnId=ids[0];
    var d=p.doneColumnId&&ids.indexOf(p.doneColumnId)>-1?p.doneColumnId:null;
    if(d){if(t.done&&t.columnId!==d)t.columnId=d;else if(!t.done&&t.columnId===d)t.columnId=ids.filter(function(x){return x!==d})[0]||ids[0]}
    if(t.kOrder==null)t.kOrder=t.order||0;
  });
  var tids={};out.tasks.forEach(function(t){tids[t.id]=1});
  out.links=out.links.filter(function(l){return l&&tids[l.fromId]&&tids[l.toId]&&l.fromId!==l.toId});
  out.diary=out.diary.filter(function(e){return e&&e.id&&e.date});
  out.goals=out.goals.filter(function(g){return g&&g.id&&(!g.projectId||pids[g.projectId])});
  out.goals.forEach(function(g){g.projectId=g.projectId||null;g.title=g.title||'Untitled goal';g.notes=g.notes||'';g.targetDate=g.targetDate||'';g.done=!!g.done;if(!g.createdAt)g.createdAt=nowISO();if(!g.updatedAt)g.updatedAt=g.createdAt});
  out.tasks.forEach(function(t){t.people=Array.isArray(t.people)?t.people.filter(function(x){return typeof x==='string'&&x.trim()}):[]});
  out.diary.forEach(function(e){e.title=e.title||'';e.text=e.text||'';e.refs=(Array.isArray(e.refs)?e.refs:[]).filter(function(r){return r&&(r.type==='project'?pids[r.id]:r.type==='task'?tids[r.id]:false)});if(!e.createdAt)e.createdAt=nowISO();if(!e.updatedAt)e.updatedAt=e.createdAt});
  return out;
}

var state=(function(){var r=lsGet(DATA_KEY);if(!r)return emptyState();try{return normalize(JSON.parse(r))}catch(e){return emptyState()}})();
var device=Object.assign({theme:'system',syncedVersion:null,lastExportAt:null,lastImportAt:null},lsJSON(DEVICE_KEY,{}));
var ui=Object.assign({projectId:null,umbrellaTab:'projects',projectTab:null,settings:false,taskId:null,showCompleted:true},lsJSON(UI_KEY,{}));
if(ui.projectId&&!P(ui.projectId))ui.projectId=null;
if(ui.taskId&&!T(ui.taskId))ui.taskId=null;

function saveUI(){lsSet(UI_KEY,JSON.stringify(ui))}
function saveDevice(){lsSet(DEVICE_KEY,JSON.stringify(device))}
function save(){state.updatedAt=nowISO();lsSet(DATA_KEY,JSON.stringify(state))}
var saveTimer=null;
function saveSoon(){clearTimeout(saveTimer);saveTimer=setTimeout(save,350)}
function flushSave(){if(saveTimer){clearTimeout(saveTimer);saveTimer=null;save()}}
window.addEventListener('pagehide',flushSave);
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='hidden')flushSave()});
function commit(fn){if(fn)fn();save();render()}

/* Undo for deletions */
var undoSnap=null;
function snapshot(){undoSnap=JSON.stringify(state)}
function undo(){if(!undoSnap)return;state=normalize(JSON.parse(undoSnap));undoSnap=null;if(ui.taskId&&!T(ui.taskId))ui.taskId=null;if(ui.projectId&&!P(ui.projectId))ui.projectId=null;saveUI();commit();toast('Restored')}

/* ---------- Data helpers ---------- */
function P(id){for(var i=0;i<state.projects.length;i++)if(state.projects[i].id===id)return state.projects[i];return null}
function T(id){for(var i=0;i<state.tasks.length;i++)if(state.tasks[i].id===id)return state.tasks[i];return null}
function projectsSorted(){return state.projects.slice().sort(byOrder)}
function tasksOf(pid){return state.tasks.filter(function(t){return t.projectId===pid})}
function childrenOf(id){return state.tasks.filter(function(t){return t.parentId===id}).sort(byOrder)}
function descendants(id){var out=[];(function walk(i){childrenOf(i).forEach(function(c){out.push(c);walk(c.id)})})(id);return out}
function isTop(t){return !t.parentId||!T(t.parentId)}
function sectionIdOf(t,p){for(var i=0;i<p.sections.length;i++)if(p.sections[i].id===t.sectionId)return t.sectionId;return p.sections[0].id}
function rootsIn(p,sid){return state.tasks.filter(function(t){return t.projectId===p.id&&isTop(t)&&sectionIdOf(t,p)===sid}).sort(byOrder)}
function nextOrder(pid,parentId){var m=0;state.tasks.forEach(function(t){if(t.projectId===pid&&(t.parentId||null)===(parentId||null))m=Math.max(m,t.order||0)});return m+1}
function siblingsOf(t){
  var p=P(t.projectId);
  if(!isTop(t))return childrenOf(t.parentId);
  return rootsIn(p,sectionIdOf(t,p));
}
function touch(t){t.updatedAt=nowISO()}

function newProject(name,description,color){
  var p={id:uid(),name:name||'Untitled project',description:description||'',color:color||COLORS[state.projects.length%COLORS.length],
    order:state.projects.reduce(function(m,x){return Math.max(m,x.order||0)},0)+1,createdAt:nowISO(),updatedAt:nowISO(),
    sections:[{id:uid(),name:'General'}],goalSections:[{id:uid(),name:'Goals'}],columns:defaultColumns()};
  p.doneColumnId=p.columns[p.columns.length-1].id;
  state.projects.push(p);return p;
}
function createTask(o){
  var p=P(o.projectId);
  var parent=o.parentId?T(o.parentId):null;
  var t={id:uid(),projectId:p.id,sectionId:parent?parent.sectionId:(o.sectionId||p.sections[0].id),parentId:parent?parent.id:null,
    title:(o.title||'').trim()||'Untitled',notes:o.notes||'',startDate:o.startDate||'',endDate:o.endDate||'',deadline:o.deadline||'',

function setDone(t,v){t.done=v;t.doneAt=v?nowISO():null;var p=P(t.projectId),d=doneCol(p);if(d){if(v)t.columnId=d;else if(colOf(t,p)===d)t.columnId=firstOpenCol(p)}touch(t)}

/* Connections: {fromId,toId,type}. type 'depends' = fromId can't start until toId finishes. */
function linksOf(id){return state.links.filter(function(l){return l.fromId===id||l.toId===id})}
function dependsTargets(id){return state.links.filter(function(l){return l.type==='depends'&&l.fromId===id}).map(function(l){return l.toId})}
function wouldCycle(from,to){
  if(from===to)return true;var seen={},stack=[to];
  while(stack.length){var x=stack.pop();if(x===from)return true;if(seen[x])continue;seen[x]=1;stack.push.apply(stack,dependsTargets(x))}
  return false;
}
function addLink(a,b,kind){
  if(a===b)return 'A task can\u2019t connect to itself.';
  if(state.links.some(function(l){return (l.fromId===a&&l.toId===b)||(l.fromId===b&&l.toId===a)}))return 'These tasks are already connected.';
  var from=a,to=b,type='depends';
  if(kind==='before'){from=b;to=a}
  if(kind==='related')type='related';
  if(type==='depends'&&wouldCycle(from,to))return 'That would create a loop: one of these tasks already waits on the other.';
  state.links.push({id:uid(),fromId:from,toId:to,type:type,createdAt:nowISO()});
  return null;
}
function linkInfo(l,id){
  var otherId=l.fromId===id?l.toId:l.fromId,label,cls='';
  if(l.type==='related'){label='Related to';cls='rel'}
  else if(l.fromId===id)label='Can\u2019t start until';
  else label='Must finish before';
  var warn='';
  if(l.type==='depends'){
    var a=T(l.fromId),b=T(l.toId);
    if(a&&b&&a.startDate&&b.endDate&&a.startDate<b.endDate){
      warn=l.fromId===id?'Starts before this one ends ('+fmtDate(b.endDate)+')':'It starts before this one ends';
    }
  }
  return {other:T(otherId),label:label,cls:cls,warn:warn};
}

function deadlineState(t){
  if(!t.deadline||t.done)return '';
  var d=daysFromToday(t.deadline);
  if(d<0)return 'overdue';if(d<=3)return 'soon';return '';
}
function projDatesTxt(p){var a=p.startDate,b=p.endDate;if(!a&&!b)return '';if(a&&b)return a===b?fmtDate(a):fmtDate(a)+' \u2013 '+fmtDate(b);return a?'From '+fmtDate(a):'Until '+fmtDate(b)}
function projDeadlineState(p){if(!p.deadline)return '';var st=projStats(p.id);if(st.total&&!st.open)return '';var d=daysFromToday(p.deadline);return d<0?'overdue':d<=7?'soon':''}

function projStats(pid){
  var ts=pid?tasksOf(pid):state.tasks,done=0,overdue=0,next=null;

}

/* ---------- Copy code encoding ---------- */
function toB64(bytes){var s='',CH=0x8000;for(var i=0;i<bytes.length;i+=CH)s+=String.fromCharCode.apply(null,bytes.subarray(i,i+CH));return btoa(s)}
function fromB64(b){var s=atob(b),out=new Uint8Array(s.length);for(var i=0;i<s.length;i++)out[i]=s.charCodeAt(i);return out}
function encodeState(){
  var bytes=new TextEncoder().encode(JSON.stringify(state));
  if(typeof CompressionStream!=='undefined'){
    try{
      var cs=new Blob([bytes]).stream().pipeThrough(new CompressionStream('gzip'));
      return new Response(cs).arrayBuffer().then(function(buf){return 'PPLAN1:'+toB64(new Uint8Array(buf))}).catch(function(){return 'PPLAN0:'+toB64(bytes)});
    }catch(e){}
  }
  return Promise.resolve('PPLAN0:'+toB64(bytes));
}
/* Tolerant code reader: survives text added or changed by mail, messages, notes and phone keyboards. */
function cleanCode(text){
  var t=String(text||'');
  try{t=t.normalize('NFKC')}catch(_){}
  t=t.replace(/[\u200B-\u200F\u2028-\u202F\u2060-\u206F\uFEFF\u00AD\u00A0]/g,' ');
  if(/%[0-9A-Fa-f]{2}/.test(t)){try{t=decodeURIComponent(t.replace(/\+/g,'%2B'))}catch(_){}}
  t=t.replace(/^[ \t]*>+[ \t]?/gm,'');
  var head=t.match(/pplan\s*([01])\s*[:\uFF1A;]/i);if(!head)return null;
  var body=t.slice(head.index+head[0].length);
  var stop=body.search(/[^A-Za-z0-9+\/=_\-\s]/);if(stop>-1)body=body.slice(0,stop);
  var tokens=body.split(/\s+/).filter(Boolean),cands=[],end=tokens.length;
  for(var i=0;i<tokens.length;i++)if(/=$/.test(tokens[i])){end=i+1;break}
  for(var k=end;k>=1&&cands.length<12;k--){
    var c=tokens.slice(0,k).join('').replace(/-/g,'+').replace(/_/g,'/').replace(/=+$/,'').replace(/=/g,'');
    if(c.length<8)continue;while(c.length%4)c+='=';
    if(cands.indexOf(c)<0)cands.push(c);
  }
  return cands.length?{kind:head[1],cands:cands}:null;
}
function decodeOne(kind,b64){
  var bytes;try{bytes=fromB64(b64)}catch(e){return Promise.reject(e)}
  var p;
  if(kind==='1'){
    if(typeof DecompressionStream==='undefined')return Promise.reject(new Error('old'));
    p=new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer().then(function(b){return new Uint8Array(b)});
  }else p=Promise.resolve(bytes);
  return p.then(function(b){var o=JSON.parse(new TextDecoder().decode(b));if(!o||!Array.isArray(o.projects))throw new Error('shape');return o});
}
function decodeCode(text){
  text=(text||'').trim();
  if(!text)return Promise.reject(new Error('Paste a copy code first.'));
  if(text.charAt(0)==='{'){try{return Promise.resolve(JSON.parse(text))}catch(e){return Promise.reject(new Error('That file couldn’t be read.'))}}
  var m=cleanCode(text);
  if(!m)return Promise.reject(new Error('This doesn’t look like a Project Planner code. Make sure you copied all of it, starting with “PPLAN”.'));
  if(m.kind==='1'&&typeof DecompressionStream==='undefined')return Promise.reject(new Error('This browser is too old to read the code. Update the phone’s software and try again.'));
  var i=0;
  function next(){
    if(i>=m.cands.length)return Promise.reject(new Error('The code is incomplete or damaged — it may have been cut off when it was copied. Try sending it as a file instead (Settings → Save as file, then Open file… on the other device).'));
    return decodeOne(m.kind,m.cands[i++]).catch(next);
  }
  return next();
}

function copyText(t){

    var ta=document.createElement('textarea');ta.value=t;ta.setAttribute('readonly','');ta.style.position='fixed';ta.style.top='0';ta.style.opacity='0';
    document.body.appendChild(ta);ta.select();ta.setSelectionRange(0,t.length);var ok=false;try{ok=document.execCommand('copy')}catch(e){}ta.remove();return ok;

    return Promise.race([navigator.clipboard.writeText(t).then(function(){return true},function(){return false}),new Promise(function(r){setTimeout(function(){r(false)},1500)})]);

    var inc=obj.updatedAt||null,cur=state.updatedAt;
    var hasLocal=state.projects.length>0;
    var older=hasLocal&&inc&&cur&&inc<cur,same=inc&&inc===cur;
    var body=(same?'<p><b>This device already has this exact version.</b> Importing changes nothing.</p>':'')+
      (older?'<div class="warn" style="margin:0 0 10px">The code is <b>older</b> than what\u2019s on this device. Importing it will replace newer changes.</div>':'')+
      '<dl class="cmp"><dt>In the code</dt><dd>'+esc(fmtExact(inc))+' \u00b7 '+plural(obj.projects.length,'project')+', '+plural(obj.tasks.length,'task')+'</dd>'+
      '<dt>On this device</dt><dd>'+(hasLocal?esc(fmtExact(cur))+' \u00b7 ':'')+plural(state.projects.length,'project')+', '+plural(state.tasks.length,'task')+'</dd></dl>'+
      (hasLocal?'<p>A backup of this device\u2019s data is kept, so you can undo from Settings \u2192 Backups.</p>':'');
    return openModal({title:'Replace this device\u2019s data?',body:body,buttons:[{label:'Cancel',value:false},{label:older?'Replace anyway':'Replace',value:true,cls:older?'danger solid':'primary'}]}).then(function(ok){
      if(!ok)return;
      pushBackup('Before import');
      replaceState(obj,true);
      device.lastImportAt=nowISO();device.syncedVersion=state.updatedAt;saveDevice();
      render();toast('Imported '+plural(state.projects.length,'project')+' and '+plural(state.tasks.length,'task'));
    });
  }).catch(function(e){openModal({title:'Couldn\u2019t import',body:'<p>'+esc(e.message)+'</p>',buttons:[{label:'OK',value:true,cls:'primary'}]})});
}

/* ---------- Modals & toasts ---------- */
function openModal(o){
  return new Promise(function(resolve){
    var root=$('#modal-root');
    root.innerHTML='<div class="modal-wrap" data-bg><div class="modal'+(o.sheet?' sheet':'')+(o.wide?' wide':'')+'" role="dialog" aria-modal="true" aria-label="'+esc(o.title)+'"><h3>'+esc(o.title)+'</h3><div class="modal-body">'+(o.body||'')+'</div><div class="modal-actions">'+
      o.buttons.map(function(b,i){return '<button class="btn '+(b.cls||'')+'" data-mbtn="'+i+'">'+esc(b.label)+'</button>'}).join('')+'</div></div></div>';
    function close(v){root.innerHTML='';document.removeEventListener('keydown',kd,true);resolve(v)}
    function kd(e){
      if(e.key==='Escape'){e.preventDefault();e.stopPropagation();close(null)}
      else if(e.key==='Enter'&&e.target.tagName==='INPUT'&&e.target.type!=='checkbox'&&e.target.type!=='radio'&&e.target.type!=='search'){e.preventDefault();var pb=root.querySelector('.btn.primary');if(pb)pb.click()}
    }
    root.querySelector('[data-bg]').addEventListener('click',function(e){if(e.target.hasAttribute('data-bg'))close(null)});
    Array.prototype.forEach.call(root.querySelectorAll('[data-mbtn]'),function(btn){
      btn.addEventListener('click',function(){
        var b=o.buttons[+btn.getAttribute('data-mbtn')];
        var v=typeof b.value==='function'?b.value(root):(b.value===undefined?b.label:b.value);
        if(v===undefined)return; // validation failed, keep open
        close(v);
      });
    });
    document.addEventListener('keydown',kd,true);
    if(o.onMount)o.onMount(root);
    var f=o.focus?root.querySelector(o.focus):root.querySelector('input:not([type=radio]),textarea');if(f){f.focus();if(!o.focus&&f.select)try{f.select()}catch(_){}}
    else{var pb=root.querySelector('.btn.primary');if(pb)pb.focus()}
  });
}

var toastTimer=null;
function toast(msg,action){
  var r=$('#toast-root');clearTimeout(toastTimer);
  r.innerHTML='<div class="toast"><span>'+esc(msg)+'</span>'+(action?'<button data-act="toast-action">'+esc(action.label)+'</button>':'')+'</div>';
  toast.action=action?action.fn:null;
  toastTimer=setTimeout(function(){r.innerHTML='';toast.action=null},action?6000:2600);
}

function localDay(ts){return ts?isoOf(new Date(ts)):''}
function statBins(range){
  var td=today(),bins=[],unit;
  if(range==='4w'||range==='3m'||range==='6m'){
    var n=range==='4w'?4:range==='3m'?13:26;unit='week';
    var ws=weekStart(td);
    for(var i=n-1;i>=0;i--){var s=addDays(ws,-7*i);bins.push({s:s,e:addDays(s,6),label:fmtDate(s)})}
  }else{
    unit='month';var d=parseISO(td),n2=12;
    if(range==='all'){
      var min=td;statsTasks().forEach(function(t){var c=localDay(t.createdAt);if(c&&c<min)min=c});
      var md=parseISO(min);n2=(d.getFullYear()-md.getFullYear())*12+d.getMonth()-md.getMonth()+1;n2=Math.max(n2,3);
    }
    for(var j=n2-1;j>=0;j--){
      var a=new Date(d.getFullYear(),d.getMonth()-j,1),b=new Date(a.getFullYear(),a.getMonth()+1,0);
      bins.push({s:isoOf(a),e:isoOf(b),label:a.toLocaleDateString(undefined,a.getMonth()===0||j===n2-1?{month:'short',year:'2-digit'}:{month:'short'})});
    }
  }
  return {bins:bins,unit:unit};
}
function niceMax(v){if(v<=4)return 4;var p=Math.pow(10,Math.floor(Math.log10(v))),m=v/p;return (m<=1?1:m<=2?2:m<=5?5:10)*p}

}

function timeBars(bins,vals,unitLbl){
